# =============================================================
# SupportSphere-AI — Continuous Deployment (CD)
# =============================================================
# Streamlit Community Cloud auto-deploys on every push to main.
# This workflow retains the Docker Hub image build for portability,
# and replaces the EC2 SSH step with a deployment status notice.
#
# Pipeline:
#   1. Checkout repository
#   2. Log in to Docker Hub
#   3. Set up Docker Buildx
#   4. Build & push image  (latest + SHA tags — optional backup)
#   5. Notify deployment success (Streamlit Cloud handles the rest)
# =============================================================

name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

  workflow_dispatch:

jobs:
  deploy:
    name: Push & Deploy
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Log in to Docker Hub (optional — keep image as backup)
      # ---------------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------------------------------------------------------
      # 3. Set up Docker Buildx
      # ---------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------------
      # 4. Build and push Docker image to Docker Hub
      #    (kept as a portable backup image)
      # ---------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/supportsphere-ai:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/supportsphere-ai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------------
      # 5. Streamlit Cloud Deployment Notice
      #    Streamlit Community Cloud watches the main branch and
      #    auto-deploys on every push — no SSH or EC2 needed.
      # ---------------------------------------------------------
      - name: Streamlit Cloud Deployment Notice
        run: |
          echo "✅ Docker image pushed to Docker Hub successfully."
          echo "🚀 Streamlit Community Cloud will auto-deploy from the main branch."
          echo "🌐 App URL: https://supportsphere-ai.streamlit.app"
          echo "📋 Manage app: https://share.streamlit.io"
